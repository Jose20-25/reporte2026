<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173b36">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Acceso al sistema de reportes misioneros 2026.">
    <link rel="manifest" href="manifest.json">
    <title>Iniciar sesión | Reportes Misioneros 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <main class="container">
        <section class="login-box" aria-labelledby="loginTitle">
            <div class="logo-container">
                <img src="logo/Central.png" alt="" class="logo">
                <p class="login-eyebrow">REPORTE ANUAL · 2026</p>
                <h1 id="loginTitle">Reportes<br>Misioneros</h1>
                <p class="login-subtitle">Inicia sesión para continuar</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="usuario">Cuenta</label>
                    <select id="usuario" name="usuario" autocomplete="username" required>
                        <option value="">Selecciona tu cuenta</option>
                        <option value="administrador">Administrador</option>
                        <option value="pastor_denis">Pastor Denis</option>
                        <option value="pastor_cesar">Pastor Cesar</option>
                        <option value="damaris_mayora">Damaris Mayora</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Ingresa tu contraseña">
                </div>

                <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

                <button type="submit" class="btn-login">Iniciar sesión <span aria-hidden="true">→</span></button>
            </form>

            <div class="footer-info">
                <p>Acceso privado para el equipo misionero</p>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
